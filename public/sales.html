<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ventas en eventos · Alpha Eve</title><link rel="stylesheet" href="/sales.css"></head><body>
<header><a href="/admin">AE · CMS</a><strong>VENTAS EN EVENTOS</strong><button id="refresh">Actualizar</button></header>
<main><p id="notice" role="status" aria-live="polite"></p><div id="workspace">Conectando…</div></main>
<dialog id="sale"><form method="dialog"><button class="cancel" aria-label="Cerrar">✕</button></form><h2 id="sale-title"></h2><p id="sale-price"></p><p>Registrar una unidad</p><div class="payments"><button data-method="cash">Efectivo</button><button data-method="transfer">Transferencia</button><button data-method="card">Tarjeta</button><button data-method="gift">Regalo · sin cobro</button></div><p id="sale-message" role="status"></p></dialog>
<dialog id="product-dialog"><form id="product-form"><div class="toolbar"><h2 id="product-title">Agregar producto</h2><button id="product-cancel" type="button" aria-label="Cerrar">✕</button></div><div class="fields"><label>Nombre<input name="title" required maxlength="160"></label><label>Categoría<select name="category"><option value="comic">Cómic / edición</option><option value="merchandise">Mercancía</option><option value="other">Otro</option></select></label><label>Precio habitual (RD$)<input name="price" type="number" min="0" max="1000000" step="0.01" required value="0"></label><label>Imagen (URL o ruta del sitio)<input name="cover" maxlength="2000" placeholder="/media/…"></label><label>O subir una imagen<input id="product-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"></label><label>Autor / propietario<input name="author" maxlength="160"></label><label>Porcentaje del autor<input name="authorPercent" type="number" min="0" max="100" step="1" value="0" required></label></div><p>El precio es una referencia para nuevos eventos. Cada evento conserva el precio y las cantidades que registraste. Autor y porcentaje se guardan como referencia.</p><button id="product-save" class="primary">Guardar producto</button><p id="product-message" role="status" aria-live="polite"></p></form></dialog>
<script type="module" src="/sales.js"></script></body></html>
